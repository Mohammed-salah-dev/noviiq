  <!-- Firebase Modular Imports & Config -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithPopup, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = "noviq-ai-d43c0";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ3JJwZSDuzfaZhuCG63yzva_ILlCzL1o",
      authDomain: "noviq-ai-d43c0.firebaseapp.com",
      projectId: "noviq-ai-d43c0",
      storageBucket: "noviq-ai-d43c0.firebasestorage.app",
      messagingSenderId: "1067646790188",
      appId: "1:1067646790188:web:344d9aa8d9aadd1d917f89",
      measurementId: "G-Y7JFTP94C4"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const googleProvider = new GoogleAuthProvider();

      window.FB = {
        appId,
        auth,
        db,
        doc,
        setDoc,
        getDoc,
        collection,
        addDoc,
        onSnapshot,
        signInAnonymously,
        signInWithPopup,
        googleProvider,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
      };
    } catch(e) {
      console.warn("Firebase Init Notice:", e);
    }

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <!-- MULTI-PAGE APPLICATION CONTROLLER -->
  <script>
    class NoviQApp {
      constructor() {
        this.lang = localStorage.getItem('noviq_lang') || 'ar';
        this.theme = localStorage.getItem('noviq_theme') || 'dark';
        this.apiConfig = JSON.parse(localStorage.getItem('noviq_api_config') || '{"provider":"gemini","key":""}');
        
        this.currentPage = 'landing';
        this.user = null;
        this.userId = 'user_' + Math.random().toString(36).substring(2, 9);
        this.state = this.loadLocalState() || this.getBlankState();
        this.obState = { step: 1, subject: 'Programming', topic: 'Python', goal: 'foundations', minutes: 30 };

        this.applyLangAndTheme();
        this.render();
        this.initFirebaseSafe();
      }

      getBlankState() {
        return {
          profile: null,
          assessment: null,
          lessons: [],
          skills: {},
          mistakes: [],
          activity: [],
          xp: 0,
          chat: []
        };
      }

      loadLocalState() {
        try {
          const data = localStorage.getItem('noviq_local_state');
          return data ? JSON.parse(data) : null;
        } catch(e) {
          return null;
        }
      }

      saveLocalState() {
        try {
          localStorage.setItem('noviq_local_state', JSON.stringify(this.state));
        } catch(e) {}
      }

      async initFirebaseSafe() {
        const boot = async () => {
          if (!window.FB) return;
          const { auth, onAuthStateChanged, signInAnonymously } = window.FB;
          try {
            onAuthStateChanged(auth, async (user) => {
              if (user) {
                this.user = user;
                this.userId = user.uid;
              } else {
                try {
                  const cred = await signInAnonymously(auth);
                  this.user = cred.user;
                  this.userId = cred.user.uid;
                } catch(err) {
                  console.warn("Anonymous auth restricted, using local session ID");
                }
              }
              this.updateAuthHeader();
            });
          } catch(e) {
            console.warn("Auth state observer notice:", e);
          }
        };

        if (window.FB) boot();
        else window.addEventListener('firebase-ready', boot);
      }

      async saveStateToFirestore() {
        this.saveLocalState();
        if (!this.userId || !window.FB) return;
        try {
          const { db, doc, setDoc } = window.FB;
          const profileRef = doc(db, 'artifacts', window.FB.appId, 'users', this.userId, 'data', 'user_profile');
          await setDoc(profileRef, Object.assign({}, this.state, { updatedAt: Date.now() }), { merge: true });
        } catch(e) {
          // Firestore rules or offline fallback handled seamlessly via localStorage
        }
      }

      navigate(page, params = {}) {
        this.currentPage = page;
        this.pageParams = params;
        this.render();
        window.scrollTo(0, 0);
      }

      applyLangAndTheme() {
        const isAr = this.lang === 'ar';
        document.documentElement.lang = this.lang;
        document.documentElement.dir = isAr ? 'rtl' : 'ltr';

        if (this.theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.body.className = "bg-light-bg text-slate-900 font-ar antialiased min-h-screen transition-colors duration-300";
          const icon = document.getElementById('theme-btn-icon');
          if (icon) icon.textContent = '☀️';
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
          document.body.className = "bg-dark-bg text-slate-200 font-ar antialiased min-h-screen transition-colors duration-300";
          const icon = document.getElementById('theme-btn-icon');
          if (icon) icon.textContent = '🌙';
        }

        const langText = document.getElementById('lang-btn-text');
        if (langText) langText.textContent = isAr ? 'English' : 'العربية';
      }

      toggleLanguage() {
        this.lang = this.lang === 'ar' ? 'en' : 'ar';
        localStorage.setItem('noviq_lang', this.lang);
        this.applyLangAndTheme();
        this.render();
      }

      toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('noviq_theme', this.theme);
        this.applyLangAndTheme();
      }

      updateAuthHeader() {
        const isAr = this.lang === 'ar';
        const wrap = document.getElementById('auth-header-btn-wrap');
        if (!wrap) return;

        if (this.user && !this.user.isAnonymous) {
          const name = this.user.displayName || 'User';
          const photo = this.user.photoURL;

          wrap.innerHTML = `
            <div class="flex items-center gap-2 bg-dark-panel2 border border-dark-border rounded-xl p-1 pr-2.5">
              ${photo ? `<img src="${photo}" class="w-6 h-6 rounded-full object-cover">` : '<span class="text-xs">👤</span>'}
              <span class="text-xs font-bold text-slate-200 max-w-[90px] truncate">${name}</span>
              <button onclick="window.NoviQ.signOutUser()" class="px-2 py-1 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 text-[11px] font-bold">
                ${isAr ? 'خروج' : 'Sign Out'}
              </button>
            </div>
          `;
        } else {
          wrap.innerHTML = `
            <button onclick="window.NoviQ.openAuthModal()" class="px-3.5 py-1.5 rounded-xl bg-brand-500 text-slate-950 font-bold text-xs flex items-center gap-2 shadow-md hover:bg-brand-400">
              <span>👤</span>
              <span>${isAr ? 'تسجيل الدخول' : 'Sign In'}</span>
            </button>
          `;
        }
      }

      openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
      closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

      async signInWithGoogle() {
        if (!window.FB) { alert('Firebase not loaded'); return; }
        const { auth, signInWithPopup, googleProvider } = window.FB;
        try {
          await signInWithPopup(auth, googleProvider);
          this.closeAuthModal();
        } catch(e) {
          alert('Google Sign-In error: ' + e.message);
        }
      }

      async signInWithEmail(isSignUp = false) {
        if (!window.FB) { alert('Firebase not loaded'); return; }
        const { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword } = window.FB;
        const email = document.getElementById('auth-email-input').value.trim();
        const pass = document.getElementById('auth-pass-input').value.trim();

        try {
          if (isSignUp) await createUserWithEmailAndPassword(auth, email, pass);
          else await signInWithEmailAndPassword(auth, email, pass);
          this.closeAuthModal();
        } catch(e) {
          alert(e.message);
        }
      }

      async signOutUser() {
        if (!window.FB) return;
        const { auth, signOut } = window.FB;
        await signOut(auth);

      async callGeminiAPI(query, systemInstruction = "") {
        const apiKey = this.apiConfig.key || "AIzaSyAZ3JJwZSDuzfaZhuCG63yzva_ILlCzL1o";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{ parts: [{ text: query }] }],
          systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
        };

        try {
          const resp = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          return data?.candidates?.[0]?.content?.parts?.[0]?.text || this.fallbackResponse(query);
        } catch(e) {
          return this.fallbackResponse(query);
        }
      }

        return isAr ?

      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.NoviQ = new NoviQApp();
    });
